<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) | ProofVoice</title>
  <meta name="description" content="The page you requested could not be found on ProofVoice.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background-color:var(--color-bg); padding:var(--space-6); text-align:center;">

  <div class="card" style="max-width:540px; padding:var(--space-10); border-radius:var(--radius-2xl);">
    <div style="font-size:4.5rem; font-weight:800; color:var(--color-primary); line-height:1; margin-bottom:var(--space-4);">
      404
    </div>
    <h1 style="font-size:var(--text-2xl); color:var(--color-navy); margin-bottom:var(--space-2);">
      Resource or Page Not Found
    </h1>
    <p style="font-size:var(--text-base); color:var(--color-text-secondary); margin-bottom:var(--space-8); line-height:1.6;">
      The page you were looking for doesn't exist, has been moved, or requires higher institutional authorization privileges.
    </p>

    <div style="display:flex; justify-content:center; gap:var(--space-3); flex-wrap:wrap;">
      <a href="index.html" class="btn btn-primary">
        Back to Home
      </a>
      <a href="student-dashboard.html" class="btn btn-secondary">
        Student Dashboard
      </a>
      <a href="admin-dashboard.html" class="btn btn-secondary">
        Admin Desk
      </a>
    </div>
  </div>

  <script src="js/data-store.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
