<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | ProofVoice</title>
  <meta name="description" content="Reset your ProofVoice institutional account password.">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page" style="justify-content:center; align-items:center; padding:var(--space-6);">

  <div class="card" style="width:100%; max-width:440px; padding:var(--space-8);">
    <div style="text-align:center; margin-bottom:var(--space-6);">
      <a href="index.html" class="brand-logo" style="margin-bottom:var(--space-4); display:inline-flex;">
        <div class="brand-icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Proof<span>Voice</span></span>
        </div>
      </a>
      <h1 style="font-size:var(--text-xl); color:var(--color-navy); margin-bottom:var(--space-1);">
        Reset Your Password
      </h1>
      <p style="font-size:var(--text-sm); color:var(--color-text-secondary);">
        Enter your institutional email address and we'll send you instructions to reset your account password.
      </p>
    </div>

    <form id="forgotPwdForm">
      <div class="form-group">
        <label for="resetEmail" class="form-label">Institutional Email <span class="required">*</span></label>
        <input type="email" id="resetEmail" class="form-control" placeholder="e.g. maya.sharma@apextech.edu" required>
      </div>

      <button type="submit" class="btn btn-primary w-100" id="sendResetBtn" style="margin-top:var(--space-4);">
        Send Reset Link
      </button>
    </form>

    <div style="text-align:center; margin-top:var(--space-6); font-size:var(--text-sm);">
      <a href="login.html" style="font-weight:600;">← Back to Sign In</a>
    </div>
  </div>

  <script src="js/data-store.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgotPwdForm');
      const btn = document.getElementById('sendResetBtn');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('resetEmail').value.trim();
        if (!email) return;

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> Dispatching reset instructions...`;

        setTimeout(() => {
          showToast('success', 'Reset Email Dispatched', `Password recovery link dispatched to ${email} (Demonstration).`);
          btn.innerHTML = 'Link Dispatched';
          setTimeout(() => window.location.href = 'login.html', 2000);
        }, 1200);
      });
    });
  </script>
</body>
</html>
